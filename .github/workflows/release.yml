name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore remoteplay-version-patcher.sln

      - name: Build release
        run: msbuild remoteplay-version-patcher.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package release files
        shell: pwsh
        run: |
          $output = "remoteplay-version-patcher\bin\Release"
          $package = "remoteplay-version-patcher-${{ github.ref_name }}-windows.zip"

          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "$output\*" -DestinationPath "dist\$package" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remoteplay-version-patcher
          path: dist/*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
